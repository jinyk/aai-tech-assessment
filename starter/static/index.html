<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Chat</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; color: #1d1d1f; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; background: #fafafa; }
  .msg { margin: 0 0 12px; white-space: pre-wrap; }
  .user { color: #0b5cad; }
  .bot { color: #1d1d1f; }
  .note { color: #777; font-style: italic; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  #message { flex: 1; padding: 8px; font: inherit; }
  button { padding: 8px 14px; font: inherit; cursor: pointer; }
  #upload { margin-top: 12px; color: #555; }
</style>
</head>
<body>
<h1>Paper Chat</h1>
<div id="log"></div>
<form id="chat">
  <input id="message" autocomplete="off" placeholder="Ask a question about the papers">
  <button>Send</button>
</form>
<div id="upload">
  Add a PDF: <input type="file" id="file" accept="application/pdf">
</div>
<script>
const log = document.getElementById("log");
const threadId = crypto.randomUUID();

function add(text, kind) {
  const p = document.createElement("p");
  p.className = "msg " + kind;
  p.textContent = text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
  return p;
}

document.getElementById("chat").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("message");
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add("You: " + message, "user");
  const waiting = add("Thinking...", "note");
  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, thread_id: threadId }),
    });
    const data = await response.json();
    waiting.remove();
    add("Bot: " + (response.ok ? data.answer : "Error: " + JSON.stringify(data)), "bot");
  } catch (error) {
    waiting.remove();
    add("Error: " + error, "note");
  }
});

document.getElementById("file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const waiting = add("Uploading " + file.name + "...", "note");
  const form = new FormData();
  form.append("file", file);
  const response = await fetch("/upload", { method: "POST", body: form });
  const data = await response.json();
  waiting.remove();
  add(response.ok ? `Added ${data.file} (${data.chunks} passages).` : "Upload failed: " + data.detail, "note");
  event.target.value = "";
});
</script>
</body>
</html>
